name: Flutter CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: write

jobs:
  doc-freshness:
    name: Doc Freshness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the merge-base diff against the target branch works.
          fetch-depth: 0

      - name: Check docs updated alongside structural changes
        run: scripts/check_doc_freshness.sh --ci "origin/${{ github.base_ref }}"

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin to the version used locally (see README) so CI does not drift
          # when a new stable lands. Bump deliberately alongside local upgrades.
          flutter-version: 3.44.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage

      - name: Coverage gate
        run: scripts/check_coverage.sh

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin to the version used locally (see README) so CI does not drift
          # when a new stable lands. Bump deliberately alongside local upgrades.
          flutter-version: 3.44.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create staging env file
        if: github.ref == 'refs/heads/dev'
        run: |
          cat > env/.env.staging <<EOF
          APP_ENV=staging
          APP_NAME=AI Vibe Flutter Base Staging
          API_BASE_URL=${{ secrets.STAGING_API_BASE_URL || 'https://staging-api.example.com' }}
          EOF

      - name: Build staging APK
        if: github.ref == 'refs/heads/dev'
        run: >-
          scripts/flutter_env.sh env/.env.staging build apk --release
          --obfuscate --split-debug-info=build/symbols

      - name: Upload staging APK
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: app-staging-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create staging release
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-${{ github.run_number }}
          name: Staging Build #${{ github.run_number }}
          body: |
            Staging build
            - Branch: dev
            - Commit: ${{ github.sha }}
            - Run: #${{ github.run_number }}

            Note: signed with debug keys. Configure release signing in
            android/app/build.gradle.kts before store distribution.
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true

      - name: Create production env file
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cat > env/.env.prod <<EOF
          APP_ENV=prod
          APP_NAME=AI Vibe Flutter Base
          API_BASE_URL=${{ secrets.PROD_API_BASE_URL || 'https://api.example.com' }}
          EOF

      - name: Build production APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: >-
          scripts/flutter_env.sh env/.env.prod build apk --release
          --obfuscate --split-debug-info=build/symbols

      - name: Upload production APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: app-production-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create production release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Production Release v1.0.${{ github.run_number }}
          body: |
            Production build
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Run: #${{ github.run_number }}

            Note: signed with debug keys. Configure release signing in
            android/app/build.gradle.kts before store distribution.
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
