name: Flutter CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: write

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build staging APK
        if: github.ref == 'refs/heads/dev'
        run: flutter build apk --release --dart-define-from-file=config/staging.json

      - name: Upload staging APK
        if: github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: app-staging-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create staging release
        if: github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-${{ github.run_number }}
          name: Staging Build #${{ github.run_number }}
          body: |
            Staging build
            - Branch: dev
            - Commit: ${{ github.sha }}
            - Run: #${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true

      - name: Build production APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: flutter build apk --release --dart-define-from-file=config/prod.json

      - name: Upload production APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: app-production-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create production release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Production Release v1.0.${{ github.run_number }}
          body: |
            Production build
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Run: #${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
